<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Form tài khoản</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body>
<div th:replace="~{base :: header}"></div>

<section class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1" th:text="${pageTitle}">Form tài khoản</h2>
            <p class="text-muted mb-0">Chọn vai trò và tạo tài khoản tự động.</p>
        </div>

        <a class="btn btn-outline-secondary" th:href="@{/admin/accounts}">
            Quay lại
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div th:if="${err}" class="alert alert-danger" th:text="${err}"></div>
            <div class="alert alert-info">
                Username và mật khẩu sẽ được hệ thống tự sinh sau khi lưu.
            </div>

            <form th:action="@{/admin/accounts}"
                  th:object="${account}"
                  method="post">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="roleCode" class="form-label">
                            Vai trò <span class="text-danger">*</span>
                        </label>
                        <select id="roleCode" class="form-select" th:field="*{roleCode}" required>
                            <option value="">-- Chọn vai trò --</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r.code}"
                                    th:text="${r.name}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="fullName" class="form-label">
                            Họ tên <span class="text-danger">*</span>
                        </label>
                        <input id="fullName" class="form-control" type="text" th:field="*{fullName}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" class="form-control" type="email" th:field="*{email}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input id="phone" class="form-control" type="text" th:field="*{phone}">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Lưu</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/accounts}">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</section>

<div th:replace="~{base :: footer}"></div>
</body>
</html>
