<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý bác sĩ</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>
<div th:replace="~{base :: header}"></div>

<section class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Quản lý bác sĩ</h2>
            <p class="text-muted mb-0">Quản lý hồ sơ bác sĩ trong hệ thống.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/admin/doctors/create}">
            + Thêm bác sĩ
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form class="row g-2 mb-3" th:action="@{/admin/doctors}" method="get">
                <div class="col-md-3">
                    <input class="form-control"
                           type="text"
                           name="kw"
                           placeholder="Tìm tên, mã, email, chuyên môn..."
                           th:value="${kw}">
                </div>

                <div class="col-md-3">
                    <select class="form-select" name="departmentId">
                        <option value="">-- Tất cả khoa --</option>
                        <option th:each="d : ${departments}"
                                th:value="${d.id}"
                                th:text="${d.name}"
                                th:selected="${departmentId != null && departmentId != '' && departmentId == d.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select class="form-select" name="doctorType">
                        <option value="">-- Loại bác sĩ --</option>
                        <option th:each="type : ${doctorTypes}"
                                th:value="${type.code}"
                                th:text="${type.label}"
                                th:selected="${doctorType == type.code}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select class="form-select" name="workStatus">
                        <option value="">-- Trạng thái --</option>
                        <option th:each="st : ${workStatuses}"
                                th:value="${st.code}"
                                th:text="${st.label}"
                                th:selected="${workStatus == st.code}">
                        </option>
                    </select>
                </div>

                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="submit">Tìm</button>
                </div>

                <div class="col-auto">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/doctors}">Reset</a>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(doctors)}" class="text-center text-muted py-5">
                Chưa có bác sĩ nào.
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(doctors)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mã</th>
                        <th>Bác sĩ</th>
                        <th>Khoa</th>
                        <th>Chuyên môn</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="d : ${doctors}">
                        <td th:text="${d.id}"></td>
                        <td th:text="${d.doctorCode}"></td>

                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${d.avatarUrl != null && !d.avatarUrl.isBlank()}"
                                     th:src="${d.avatarUrl}"
                                     alt="avatar"
                                     class="rounded-circle"
                                     style="width: 42px; height: 42px; object-fit: cover;">

                                <div>
                                    <strong th:text="${d.fullName}"></strong>
                                    <div class="text-muted small" th:text="${d.email}"></div>
                                    <div class="text-muted small" th:text="${d.phone}"></div>
                                </div>
                            </div>
                        </td>

                        <td th:text="${d.departmentId != null ? d.departmentId.name : '—'}"></td>
                        <td th:text="${d.specialization} ?: '—'"></td>

                        <td th:text="${T(com.evercare.enums.DoctorType).labelOf(d.doctorType)}"></td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${d.workStatus == 'AVAILABLE'}"
                                  th:text="${T(com.evercare.enums.DoctorWorkStatus).labelOf(d.workStatus)}"></span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${d.workStatus == 'BUSY'}"
                                  th:text="${T(com.evercare.enums.DoctorWorkStatus).labelOf(d.workStatus)}"></span>

                            <span class="badge bg-secondary"
                                  th:if="${d.workStatus == 'OFF_DUTY'}"
                                  th:text="${T(com.evercare.enums.DoctorWorkStatus).labelOf(d.workStatus)}"></span>

                            <span class="badge bg-danger"
                                  th:if="${d.workStatus == 'INACTIVE'}"
                                  th:text="${T(com.evercare.enums.DoctorWorkStatus).labelOf(d.workStatus)}"></span>
                        </td>

                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-warning"
                                   th:href="@{/admin/doctors/{id}/edit(id=${d.id})}">
                                    Sửa
                                </a>

                                <form th:action="@{/admin/doctors/{id}/delete(id=${d.id})}"
                                      method="post"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa bác sĩ này?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

     <nav th:if="${pages != null}" class="mt-3">
        <ul class="pagination justify-content-end">

            <li class="page-item" th:classappend="${page <= 1} ? 'disabled'">
                <a class="page-link" th:href="${page > 1} ? @{/admin/doctors(page=${page - 1}, kw=${kw}, departmentId=${departmentId}, doctorType=${doctorType}, workStatus=${workStatus})} : '#'">Trước</a>
            </li>

            <li class="page-item"
                th:each="p : ${#numbers.sequence(1, pages)}"
                th:classappend="${p == page} ? 'active'">

                <a class="page-link"
                th:text="${p}"
                th:href="@{/admin/doctors(page=${p}, kw=${kw}, departmentId=${departmentId}, doctorType=${doctorType}, workStatus=${workStatus})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${page >= pages} ? 'disabled'">
                <a class="page-link" th:href="${page < pages} ? @{/admin/doctors(page=${page + 1}, kw=${kw}, departmentId=${departmentId}, doctorType=${doctorType}, workStatus=${workStatus})} : '#'">Sau</a>
            </li>

        </ul>
    </nav>
</section>

<div th:replace="~{base :: footer}"></div>
</body>
</html>
