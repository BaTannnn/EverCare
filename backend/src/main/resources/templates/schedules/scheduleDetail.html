<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Form lịch làm việc</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>
<div th:replace="~{base :: header}"></div>

<section class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1" th:text="${pageTitle}">Form lịch làm việc</h2>
            <p class="text-muted mb-0">Nhập khung giờ làm việc của bác sĩ.</p>
        </div>

        <a class="btn btn-outline-secondary" th:href="@{/admin/schedules}">
            Quay lại
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div th:if="${err}" class="alert alert-danger" th:text="${err}"></div>

            <form th:action="${isEdit}
                    ? @{/admin/schedules/{id}/edit(id=${scheduleId})}
                    : @{/admin/schedules}"
                  th:object="${schedule}"
                  method="post">

                <div class="mb-3">
                    <label for="doctorId" class="form-label">
                        Bác sĩ <span class="text-danger">*</span>
                    </label>

                    <select id="doctorId"
                            class="form-select"
                            th:field="*{doctorId}"
                            required>
                        <option value="">-- Chọn bác sĩ --</option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.fullName + ' - ' + (d.departmentId != null ? d.departmentId.name : 'Chưa có khoa')}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="workDate" class="form-label">Ngày làm việc</label>
                        <input id="workDate"
                               class="form-control"
                               type="date"
                               th:field="*{workDate}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="startTime" class="form-label">Giờ bắt đầu</label>
                        <input id="startTime"
                               class="form-control"
                               type="time"
                               th:field="*{startTime}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="endTime" class="form-label">Giờ kết thúc</label>
                        <input id="endTime"
                               class="form-control"
                               type="time"
                               th:field="*{endTime}"
                               required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="maxPatients" class="form-label">Số bệnh nhân tối đa</label>
                        <input id="maxPatients"
                               class="form-control"
                               type="number"
                               min="1"
                               th:field="*{maxPatients}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">Trạng thái</label>
                        <select id="status"
                                class="form-select"
                                th:field="*{status}">
                            <option th:each="st : ${statuses}"
                                    th:value="${st.code}"
                                    th:text="${st.label}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="note" class="form-label">Ghi chú</label>
                    <input id="note"
                           class="form-control"
                           type="text"
                           th:field="*{note}"
                           placeholder="Ví dụ: Chỉ khám bệnh nhân đặt trước">
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Lưu</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/schedules}">Hủy</a>
                </div>

            </form>

        </div>
    </div>

</section>

<div th:replace="~{base :: footer}"></div>
</body>
</html>
