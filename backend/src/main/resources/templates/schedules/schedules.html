<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý lịch làm việc</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>
<div th:replace="~{base :: header}"></div>

<section class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Quản lý lịch làm việc</h2>
            <p class="text-muted mb-0">Quản lý khung giờ làm việc của bác sĩ.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/admin/schedules/create}">
            + Thêm lịch
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form class="row g-2 mb-3" th:action="@{/admin/schedules}" method="get">
                <div class="col-md-3">
                    <select class="form-select" name="doctorId">
                        <option value="">-- Tất cả bác sĩ --</option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.fullName}"
                                th:selected="${doctorId != null && doctorId != '' && doctorId == d.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select class="form-select" name="departmentId">
                        <option value="">-- Tất cả khoa --</option>
                        <option th:each="dep : ${departments}"
                                th:value="${dep.id}"
                                th:text="${dep.name}"
                                th:selected="${departmentId != null && departmentId != '' && departmentId == dep.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <input class="form-control"
                           type="date"
                           name="workDate"
                           th:value="${workDate}">
                </div>

                <div class="col-md-2">
                    <select class="form-select" name="status">
                        <option value="">-- Trạng thái --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st.code}"
                                th:text="${st.label}"
                                th:selected="${status == st.code}">
                        </option>
                    </select>
                </div>

                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="submit">Tìm</button>
                </div>

                <div class="col-auto">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/schedules}">Reset</a>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(schedules)}" class="text-center text-muted py-5">
                Chưa có lịch làm việc nào.
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(schedules)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Bác sĩ</th>
                        <th>Khoa</th>
                        <th>Ngày</th>
                        <th>Giờ</th>
                        <th>Max</th>
                        <th>Trạng thái</th>
                        <th>Ghi chú</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="s : ${schedules}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.doctorId != null ? s.doctorId.fullName : '—'}"></td>
                        <td th:text="${s.doctorId != null && s.doctorId.departmentId != null ? s.doctorId.departmentId.name : '—'}"></td>
                        <td th:text="${s.workDate}"></td>
                        <td>
                            <span th:text="${s.startTime}"></span>
                            -
                            <span th:text="${s.endTime}"></span>
                        </td>
                        <td th:text="${s.maxPatients}"></td>
                        <td th:text="${s.status}"></td>
                        <td th:text="${s.note} ?: '—'"></td>

                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-warning"
                                   th:href="@{/admin/schedules/{id}/edit(id=${s.id})}">
                                    Sửa
                                </a>

                                <form th:action="@{/admin/schedules/{id}/delete(id=${s.id})}"
                                      method="post"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa lịch này?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</section>

<div th:replace="~{base :: footer}"></div>
</body>
</html>
