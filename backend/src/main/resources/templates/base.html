
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>everCare</title>
        <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        </th:block>
    </head>
    <body>
        <header th:fragment="header">
            <nav class="navbar navbar-expand-sm navbar-dark sticky-top" style="background: linear-gradient(135deg, #0f172a, #0f766e); box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);">
                <div class="container-fluid">
                    <a class="navbar-brand fw-semibold" th:href="@{/admin}">everCare Admin</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">
                        <ul class="navbar-nav ms-auto align-items-sm-center gap-sm-1" sec:authorize="hasRole('ADMIN')">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/}">Trang chủ</a>
                            </li>
                            
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/departments}">Khoa</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/services}">Dịch vụ</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/doctors}">Bác sĩ</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/employees}">Nhân viên</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/schedules}">Lịch bác sĩ</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/admin/statistics}">Thống kê</a>
                            </li>
                            
                            <li class="nav-item">
                               <a class="nav-link" th:href="@{/logout}">Đăng xuất</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        
        <footer th:fragment="footer" class="py-3 mt-4 border-top bg-white">
                <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
                    <span class="text-muted">everCare Admin &copy; 2026</span>
                    <span class="text-muted small">Online Clinic Management System</span>
                </div>
        </footer>


        <th:block th:fragment="scripts">
            <script src="@{js/script.js}"></script>
        </th:block>


    </body>
</html>
