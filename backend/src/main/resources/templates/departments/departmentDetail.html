
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Trang chủ</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <section class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
                <div>
                    <h2 class="mb-1" th:text="${pageTitle}">Form khoa</h2>
                    <p class="text-muted mb-0">Nhập thông tin khoa/phòng ban.</p>
                </div>

                <a class="btn btn-outline-secondary" th:href="@{/admin/departments}">
                    Quay lại
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <form th:action="${isEdit}
                    ? @{/admin/departments/{id}/edit(id=${departmentId})}
                    : @{/admin/departments}" 
                    th:object="${department}" method="post">
                        <div th:if="${err}" class="alert alert-danger" th:text="${err}"></div>
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Tên khoa <span class="text-danger">*</span>
                            </label>

                            <input id="name"
                                   class="form-control"
                                   type="text"
                                   th:field="*{name}"
                                   placeholder="Ví dụ: Khoa Nội tổng quát"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>

                            <textarea id="description"
                                      class="form-control"
                                      rows="4"
                                      th:field="*{description}"
                                      placeholder="Nhập mô tả ngắn về khoa"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Lưu</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/departments}">Hủy</a>
                        </div>
                        
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{code}" />
                    </form>

                </div>
            </div>
        
    </section>

    <div th:replace="base :: footer"></div>
</body>
</html>
