<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý nhân viên</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body>
<div th:replace="~{base :: header}"></div>

<section class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Quản lý nhân viên</h2>
            <p class="text-muted mb-0">Quản lý hồ sơ nhân viên trong hệ thống.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/admin/employees/create}">
            + Thêm nhân viên
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form class="row g-2 mb-3" th:action="@{/admin/employees}" method="get">
                <div class="col-md-5">
                    <input class="form-control"
                           type="text"
                           name="kw"
                           placeholder="Tìm mã, tên, số điện thoại, email, chức vụ..."
                           th:value="${kw}">
                </div>

                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
                </div>

                <div class="col-auto">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/employees}">Reset</a>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(employees)}" class="text-center text-muted py-5">
                Chưa có nhân viên nào.
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(employees)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mã NV</th>
                        <th>Nhân viên</th>
                        <th>Chức vụ</th>
                        <th>Liên hệ</th>
                        <th>Ngày vào làm</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="e : ${employees}">
                        <td th:text="${e.id}"></td>
                        <td th:text="${e.employeeCode}"></td>
                        <td>
                            <strong th:text="${e.fullName}"></strong>
                            <div class="text-muted small">
                                <span th:text="${e.gender} ?: '—'"></span>
                                <span th:if="${e.dateOfBirth != null}">
                                    • <span th:text="${#dates.format(e.dateOfBirth, 'dd/MM/yyyy')}"></span>
                                </span>
                            </div>
                        </td>
                        <td th:text="${e.position}"></td>
                        <td>
                            <div th:text="${e.phone}"></div>
                            <div class="text-muted small" th:text="${e.email} ?: '—'"></div>
                        </td>
                        <td th:text="${e.hiredDate != null ? #dates.format(e.hiredDate, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-warning"
                                   th:href="@{/admin/employees/{id}(id=${e.id})}">
                                    Sửa
                                </a>

                                <form th:action="@{/admin/employees/{id}/delete(id=${e.id})}"
                                      method="post"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa nhân viên này?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav th:if="${pages > 1}" class="mt-3">
        <ul class="pagination justify-content-end">
            <li class="page-item" th:classappend="${page <= 1} ? 'disabled'">
                <a class="page-link" th:href="${page > 1} ? @{/admin/employees(page=${page - 1}, kw=${kw})} : '#'">Trước</a>
            </li>

            <li class="page-item"
                th:each="p : ${#numbers.sequence(1, pages)}"
                th:classappend="${p == page} ? 'active'">
                <a class="page-link"
                   th:text="${p}"
                   th:href="@{/admin/employees(page=${p}, kw=${kw})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${page >= pages} ? 'disabled'">
                <a class="page-link" th:href="${page < pages} ? @{/admin/employees(page=${page + 1}, kw=${kw})} : '#'">Sau</a>
            </li>
        </ul>
    </nav>
</section>

<div th:replace="~{base :: footer}"></div>
</body>
</html>
