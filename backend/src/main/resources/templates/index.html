<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Trang chủ</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <section class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-lg bg-body-tertiary">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                            <div>
                                <p class="text-uppercase text-primary fw-semibold mb-2">Admin dashboard</p>
                                <h1 class="h3 mb-3">Thống kê &amp; Báo cáo</h1>
                                <p class="text-muted mb-0">Theo dõi bệnh nhân, dịch vụ, bệnh phổ biến và doanh thu.</p>
                            </div>
                            <div class="text-md-end">
                                <a class="btn btn-primary btn-lg" th:href="@{/admin/statistics}">Mở báo cáo</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
