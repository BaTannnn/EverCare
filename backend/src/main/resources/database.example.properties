hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.showSql=${HIBERNATE_SHOW_SQL:false}
hibernate.connection.driverClass=com.mysql.cj.jdbc.Driver
hibernate.connection.url=${DB_URL:jdbc:mysql://localhost:3306/evercaredb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
hibernate.connection.username=${DB_USERNAME:root}
hibernate.connection.password=${DB_PASSWORD:}
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
